# GitLab CI — mirror of .github/workflows/ci.yml.
#
# The canonical remote is GitLab, but the GitHub Actions workflow does not run
# on GitLab pushes.  This pipeline runs the same gates (ruff lint + format,
# mypy, pytest with the 80% coverage floor) so pushing to GitLab is actually
# verified.  Keep the tool versions in lockstep with pyproject.toml [dev] and
# .pre-commit-config.yaml.

default:
  image: python:3.12
  # gitlab01 has no untagged runners: jobs without tags sit in "pending"
  # until the stuck-timeout kills them (root cause of 5 days of red
  # pipelines).  Both instance runners are docker (dind) executors;
  # dind-shared-2 is the general-purpose one.
  tags:
    - dind-shared-2

stages:
  - smoke
  - check

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

# Fast, zero-dependency gate over the safety-critical core (<2s).
stdlib-smoke:
  stage: smoke
  script:
    - python tools/stdlib_smoke.py

# Full gate: lint + format-check + types + tests with the coverage floor.
lint-type-test:
  stage: check
  needs: ["stdlib-smoke"]
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - ruff check local_codex_lite/ tests/
    - ruff format --check local_codex_lite/ tests/
    - mypy local_codex_lite/
    - pytest -q --tb=short --cov=local_codex_lite --cov-report=term --cov-fail-under=80
  coverage: '/^TOTAL.+?(\d+\%)$/'
