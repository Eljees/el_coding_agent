name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel an in-flight CI run when the same branch / PR is updated; saves CI
# minutes during fast iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdlib-smoke:
    # Fast no-deps gate: runs the safety-critical core (safety, capabilities,
    # intent, patch_errors, ...) with only the Python stdlib via
    # tools/stdlib_smoke.py.  Catches obvious regressions in <2s before the
    # full matrix spins up pip+pydantic+httpx wheels.
    name: stdlib smoke (no deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stdlib smoke
        run: python tools/stdlib_smoke.py

  lint-and-test:
    name: lint+tests py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: stdlib-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # local-codex-lite targets Windows / PowerShell, so we exercise the
          # whole pipeline on at least one Windows runner.  Keep it on the
          # newest supported Python only to limit CI time.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check local_codex_lite/ tests/

      - name: Ruff format (check only)
        run: ruff format --check local_codex_lite/ tests/

      - name: Mypy type check
        run: mypy local_codex_lite/

      - name: Pytest with coverage
        run: pytest -q --tb=short --cov=local_codex_lite --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  cli-smoke:
    name: cli smoke (no LLM)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: doctor deps (no network)
        run: python -m local_codex_lite doctor deps
      - name: config show (defaults)
        run: python -m local_codex_lite config show
      - name: recognize (intent routing only)
        run: |
          python -m local_codex_lite recognize "покажи последние логи"
          python -m local_codex_lite recognize "запусти trufflehog scan"

  ruff-canary:
    # Informational only: installs the LATEST ruff (unpinned) and lints, so a
    # new ruff release that would introduce findings is visible early WITHOUT
    # breaking the gate.  The pinned ruff in lint-and-test stays authoritative.
    name: ruff canary (latest, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install latest ruff
        run: python -m pip install --upgrade ruff
      - name: Ruff check (latest -- informational)
        run: |
          ruff --version
          ruff check local_codex_lite/ tests/
