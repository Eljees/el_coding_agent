name: mutmut

# Mutation testing is slow (minutes per file) and noisy, so we deliberately
# do NOT gate PRs on it.  Instead:
#   - schedule: a weekly run posts the latest survivor count as an artifact;
#   - workflow_dispatch: a maintainer can trigger it on demand from the UI.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 04:00 UTC — quiet hour for the runner pool.
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Baseline pytest (sanity-check before mutation)
        run: pytest -x -q

      - name: Run mutmut
        # mutmut returns non-zero when survivors exist.  We swallow that
        # because the report is the artifact, not the gate.
        run: |
          mutmut run || true
          mutmut results || true

      - name: Export mutmut HTML report
        run: |
          mutmut html || true
        continue-on-error: true

      - name: Upload mutmut artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: |
            .mutmut-cache
            html/
            mutants/
          if-no-files-found: ignore
          retention-days: 30
