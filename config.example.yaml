llm:
  base_url: "http://localhost:8015/v1"
  model: "qwen25-coder-14b-awq"
  api_key: "local-not-needed"
  temperature: 0.1
  max_tokens: 2048
  timeout: 120.0
  retries: 2
workspace:
  root: "."
  max_file_bytes: 120000
  include_globs:
    - "**/*.py"
    - "**/*.md"
    - "**/*.toml"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
  exclude_globs:
    - ".git/**"
    - ".venv/**"
    - "venv/**"
    - "__pycache__/**"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - "node_modules/**"
    - ".local-codex-lite/**"
    - ".tmp/**"
    - ".vscode/**"
    - "__old/**"
    - "generated_projects/**"
    - "pytest_tmp/**"
    - "scan_runs/**"
    - "tmp_trufflehog/**"
    - "*.egg-info/**"
safety:
  require_apply_flag: true
  require_exec_flag: true
  allow_sensitive_read: false
  max_patch_attempts: 4
rag:
  provider: "keyword"
  enabled: true
  store_dir: ".local-codex-lite/rag/keyword"
  top_k: 8
  chunk_chars: 1800
  overlap_chars: 250
  max_context_chars: 12000
  include_globs:
    - "**/*.py"
    - "**/*.md"
    - "**/*.toml"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
    - "**/*.ps1"
  exclude_globs:
    - ".git/**"
    - ".venv/**"
    - "venv/**"
    - "__pycache__/**"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - "node_modules/**"
    - ".local-codex-lite/**"
    - ".tmp/**"
    - ".vscode/**"
    - "__old/**"
    - "**/.env"
    - "**/*secret*"
    - "**/*token*"
    - "**/*private*"
