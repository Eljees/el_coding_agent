llm:
  base_url: "http://localhost:8015/v1"
  model: "qwen25-coder-14b-awq"
  api_key: "local-not-needed"
  temperature: 0.1
  max_tokens: 2048
  timeout: 120.0
  retries: 2
  # Hard wall-clock deadline for the suggest-commands stage as a whole;
  # on timeout the suggestions are skipped and the run still succeeds.
  suggest_timeout_seconds: 120
# Optional named LLM profiles; activate one for a single run via
# `--profile <name>` on `run` / `preview` / `ask` / `review`.
# Without --profile the agent uses the `llm:` block above as before.
llm_profiles: {}
  # fast:
  #   base_url: "http://localhost:8100/v1"
  #   model: "qwen25-coder-7b"
  #   temperature: 0.0
  #   max_tokens: 1024
  # review:
  #   base_url: "http://localhost:8200/v1"
  #   model: "qwen25-coder-32b-awq"
  #   temperature: 0.0
  #   max_tokens: 4096
  #   timeout: 300.0
workspace:
  root: "."
  max_file_bytes: 120000
  include_globs:
    - "**/*.py"
    - "**/*.md"
    - "**/*.toml"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
  exclude_globs:
    - ".git/**"
    - ".venv/**"
    - "venv/**"
    - "__pycache__/**"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - "node_modules/**"
    - ".local-codex-lite/**"
    - ".tmp/**"
    - ".vscode/**"
    - "__old/**"
    - "generated_projects/**"
    - "pytest_tmp/**"
    - "scan_runs/**"
    - "tmp_trufflehog/**"
    - "*.egg-info/**"
safety:
  require_apply_flag: true
  require_exec_flag: true
  allow_sensitive_read: false
  max_patch_attempts: 4
  # Post-apply smoke run executes generated entrypoint scripts: opt-in only.
  # Enable per run with `run --smoke` or persistently here.
  smoke_run_default: false
  smoke_timeout_seconds: 10
rag:
  provider: "keyword"
  enabled: true
  store_dir: ".local-codex-lite/rag/keyword"
  top_k: 8
  chunk_chars: 1800
  overlap_chars: 250
  max_context_chars: 12000
  include_globs:
    - "**/*.py"
    - "**/*.md"
    - "**/*.toml"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
    - "**/*.ps1"
  exclude_globs:
    - ".git/**"
    - ".venv/**"
    - "venv/**"
    - "__pycache__/**"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - "node_modules/**"
    - ".local-codex-lite/**"
    - ".tmp/**"
    - ".vscode/**"
    - "__old/**"
    - "**/.env"
    - "**/*secret*"
    - "**/*token*"
    - "**/*private*"
