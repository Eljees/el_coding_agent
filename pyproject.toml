[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-codex-lite"
version = "0.1.0"
description = "Local coding agent MVP for Windows/PowerShell"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Elaria", email = "3.14hell@gmail.com" },
]
keywords = [
  "coding-agent",
  "local-llm",
  "vllm",
  "openai-compatible",
  "patch-generation",
  "evidence-first",
  "cve-bin-tool",
  "trufflehog",
  "tkinter",
  "windows",
  "powershell",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries",
  "Topic :: Security",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.urls]
"Source" = "https://gitlab01.soc.rt.ru/yurij.m.tumanov/el_coding_agent"
"Changelog" = "https://gitlab01.soc.rt.ru/yurij.m.tumanov/el_coding_agent/-/blob/test/artifact-unpack/CHANGELOG.md"

[project.scripts]
local-codex-lite = "local_codex_lite.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mutmut>=2.5",
  # Pin ruff/mypy to exact versions so local pre-commit and CI agree.
  # These MUST stay in lockstep with .pre-commit-config.yaml.
  "ruff==0.15.15",
  "mypy==1.14.1",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
  # Needed by skills/appsechub tests (pytest tests/ skills/).
  "requests>=2.31",
]
rich = [
  "rich>=13.7",
]
rag = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "transformers>=4.51.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".local-codex-lite",
  ".tmp",
  ".venv",
  "generated_projects",
  "scan_runs",
  "tmp_trufflehog",
  "pytest_tmp",
]

[tool.ruff.lint]
# Rule families we care about today.  Keep this list explicit so adding a
# family is a deliberate decision and not a silent CI surprise.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes (unused imports, undefined names, ...)
  "I",    # isort (import order)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear (real-bug heuristics)
  "SIM",  # flake8-simplify
  "W",    # pycodestyle warnings
  "RUF",  # ruff-specific lints
]
# Opt-out for rules that fire heavily on the current code base and would
# require a separate cleanup pass.  We can drop these one by one as time
# allows.
ignore = [
  "E501",   # line-too-long: handled by ruff format width budget
  "B008",   # function call in default argument
  "B904",   # use 'raise ... from err' (legacy paths)
  "SIM108", # use ternary -- often less readable for our explicit flow
  "SIM117", # combine nested with-statements
  "SIM102", # collapsible-if -- explicit nested guards read clearer here
  "SIM103", # needless-bool -- guard-clause style is intentional
  "SIM105", # suppressible-exception -- explicit try/except/pass is clearer
  "SIM109", # compare-with-tuple -- explicit equality chain is intentional
  "UP007",  # use X | Y instead of Optional[X] (cosmetic)
  # This is a Russian-language tool: Cyrillic literals in intent strings and
  # test assertions are intentional, not typos.  Silence the ambiguous-unicode
  # family rather than mangle the text.
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely use star imports / unused fixtures / long expressions.
"tests/**" = ["E402", "F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["local_codex_lite"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
# Stricter knobs we want enforced by CI.  --ignore-missing-imports is dropped
# from the workflow; the dev extras pin types-PyYAML and pydantic/httpx ship
# their own typing, so the third-party surface is covered.
check_untyped_defs = true
no_implicit_optional = true
# Be pragmatic about the existing code base: the UI / planner are still
# loosely typed and would need a separate annotation pass before we can flip
# disallow_untyped_defs.  We do not silence them globally yet.
warn_redundant_casts = true

[[tool.mypy.overrides]]
# tk / chromadb / sentence_transformers don't ship reliable type info; allow
# missing imports there explicitly rather than across the whole project.
module = [
  "chromadb.*",
  "sentence_transformers.*",
  "transformers.*",
  "tkinter.*",
  "rich.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.mutmut]
# Mutation testing is scoped to the safety-critical modules: every survivor
# here is a real gap in the test suite.  The rest of the package (UI, RAG,
# planner heuristics) is excluded because it is either tested weakly or
# inherently depends on a live LLM, which mutmut cannot evaluate.
paths_to_mutate = [
  "local_codex_lite/safety.py",
  "local_codex_lite/patcher.py",
  "local_codex_lite/patch_errors.py",
  "local_codex_lite/llm_client.py",
]
tests_dir = "tests"
# -x stops the test run on the first failure, which is enough to flag the
# mutation as caught and dramatically speeds the overall mutmut pass.
runner = "python -m pytest -x -q"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["local_codex_lite*"]
exclude = ["tests*", "tools*", "examples*", "scan_runs*", "tmp_trufflehog*"]
