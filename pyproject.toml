[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-codex-lite"
version = "0.1.0"
description = "Local coding agent MVP for Windows/PowerShell"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.scripts]
local-codex-lite = "local_codex_lite.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]
rich = [
  "rich>=13.7",
]
rag = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "transformers>=4.51.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["local_codex_lite*"]
exclude = ["tests*", "tools*", "scan_runs*", "tmp_trufflehog*"]
